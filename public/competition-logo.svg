    <path d="M104 210q28-18 62-6" stroke="#fff" stroke-width="9" stroke-linecap="round" opacity=".35"/>
    <text x="155" y="292" text-anchor="middle" font-family="'Arial Black',Arial,sans-serif" font-size="92" font-weight="900" fill="#fff">P</text>
  </g>
  <g transform="rotate(4 330 255)">
    <rect x="260" y="192" width="150" height="150" rx="28" fill="#B45309"/>
