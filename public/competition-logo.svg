  <!-- Dotted separator -->
  <line x1="120" y1="386" x2="1280" y2="386" stroke="#94A3B8" stroke-width="7" stroke-linecap="round" stroke-dasharray="2 20"/>

  <!-- BUILDING bar -->
  <rect x="60" y="410" width="1280" height="150" rx="42" fill="#0B1C3A"/>
  <text x="700" y="522" text-anchor="middle" font-family="'Arial Black',Arial,sans-serif" font-size="106" font-weight="900" letter-spacing="9" fill="#FBBF24">BUILDING</text>

  <!-- COMPETITION -->
  <text x="640" y="720" text-anchor="middle" font-family="'Arial Black',Arial,sans-serif" font-size="104" font-weight="900" letter-spacing="3" fill="#2563EB" stroke="#14264A" stroke-width="14" paint-order="stroke">COMPETITION</text>

  <!-- Year badge -->
  <circle cx="1245" cy="700" r="92" fill="#FBBF24" stroke="#14264A" stroke-width="12"/>
  <text x="1245" y="730" text-anchor="middle" font-family="'Arial Black',Arial,sans-serif" font-size="58" font-weight="900" fill="#14264A">2026</text>
