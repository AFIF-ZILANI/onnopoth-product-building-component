    <path d="M279 210q28-18 62-6" stroke="#fff" stroke-width="9" stroke-linecap="round" opacity=".35"/>
    <text x="330" y="292" text-anchor="middle" font-family="'Arial Black',Arial,sans-serif" font-size="92" font-weight="900" fill="#14264A">R</text>
  </g>
  <g transform="rotate(-4 505 255)">
    <rect x="435" y="192" width="150" height="150" rx="28" fill="#0E7490"/>
    <rect x="430" y="180" width="150" height="150" rx="28" fill="#22D3EE" stroke="#14264A" stroke-width="7"/>
    <path d="M454 210q28-18 62-6" stroke="#fff" stroke-width="9" stroke-linecap="round" opacity=".4"/>
    <text x="505" y="292" text-anchor="middle" font-family="'Arial Black',Arial,sans-serif" font-size="92" font-weight="900" fill="#14264A">O</text>
  </g>
  <g transform="rotate(3 680 255)">
    <rect x="610" y="192" width="150" height="150" rx="28" fill="#070D24"/>
    <rect x="605" y="180" width="150" height="150" rx="28" fill="#14264A" stroke="#0B1C3A" stroke-width="7"/>
    <path d="M629 210q28-18 62-6" stroke="#94A3B8" stroke-width="9" stroke-linecap="round" opacity=".45"/>
    <text x="680" y="292" text-anchor="middle" font-family="'Arial Black',Arial,sans-serif" font-size="92" font-weight="900" fill="#FBBF24">D</text>
  </g>
  <g transform="rotate(-5 855 255)">
    <rect x="785" y="192" width="150" height="150" rx="28" fill="#1D4ED8"/>
