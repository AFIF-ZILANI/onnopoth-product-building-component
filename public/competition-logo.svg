    <path d="M804 210q28-18 62-6" stroke="#fff" stroke-width="9" stroke-linecap="round" opacity=".35"/>
    <text x="855" y="292" text-anchor="middle" font-family="'Arial Black',Arial,sans-serif" font-size="92" font-weight="900" fill="#fff">U</text>
  </g>
  <g transform="rotate(4 1030 255)">
    <rect x="960" y="192" width="150" height="150" rx="28" fill="#B45309"/>
    <rect x="955" y="180" width="150" height="150" rx="28" fill="#F59E0B" stroke="#14264A" stroke-width="7"/>
    <path d="M979 210q28-18 62-6" stroke="#fff" stroke-width="9" stroke-linecap="round" opacity=".35"/>
    <text x="1030" y="292" text-anchor="middle" font-family="'Arial Black',Arial,sans-serif" font-size="92" font-weight="900" fill="#14264A">C</text>
  </g>
  <g transform="rotate(-4 1205 255)">
    <rect x="1135" y="192" width="150" height="150" rx="28" fill="#0E7490"/>
    <rect x="1130" y="180" width="150" height="150" rx="28" fill="#22D3EE" stroke="#14264A" stroke-width="7"/>
    <path d="M1154 210q28-18 62-6" stroke="#fff" stroke-width="9" stroke-linecap="round" opacity=".4"/>
