<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" fill="none">
  <title>Product Building Competition (Using AI) — OnnoPoth</title>

  <!-- Top bar: brand + tag -->
  <path d="M56 44C56 44 40 62 40 74a16 16 0 0 0 32 0c0-12-16-30-16-30Z" stroke="#14264A" stroke-width="6" stroke-linejoin="round"/>
  <circle cx="56" cy="40" r="7" fill="#3B82F6"/>
  <text x="90" y="86" font-family="'Arial Black',Arial,sans-serif" font-size="52" font-weight="900" letter-spacing="4" fill="#14264A">ONNOPOTH</text>
  <rect x="1130" y="46" width="230" height="66" rx="33" fill="#FBBF24" stroke="#14264A" stroke-width="7"/>
  <text x="1245" y="92" text-anchor="middle" font-family="'Arial Black',Arial,sans-serif" font-size="32" font-weight="900" fill="#14264A">USING AI</text>

  <!-- Seven letter tiles -->
  <g transform="rotate(-5 155 255)">
